<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <script src="/theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Willow — Journal</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#5f7d66" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="container">
    <header class="top-bar">
      <a class="wordmark" href="/">
        <span class="wordmark-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20c0-7 3-13 11-16-1 8-4 13-11 16z"/><path d="M8.5 15.5C11 13 13 9.5 15 4"/></svg>
        </span>
        <span class="wordmark-name">Willow</span>
        <span class="wordmark-section">— Journal</span>
      </a>
      <div class="top-bar-right">
        <nav class="nav-cluster">
          <a class="nav-pill active" href="/journal.html">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H12v18H6.5A2.5 2.5 0 0 1 4 18.5v-13z"/><path d="M20 5.5A2.5 2.5 0 0 0 17.5 3H12v18h5.5a2.5 2.5 0 0 0 2.5-2.5v-13z"/></svg>
            <span class="nav-pill-label">Log</span>
          </a>
          <a class="nav-pill" href="/quiz.html">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 14l3-4 3 3 4-6"/></svg>
            <span class="nav-pill-label">BDI</span>
          </a>
          <a class="nav-pill" href="/cbt.html">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
            <span class="nav-pill-label">CBT</span>
          </a>
        </nav>
      </div>
    </header>

    <div class="log-header">
      <div class="title-block">
        <a class="text-link" href="/">← Write</a>
      </div>
      <button class="gratitude-filter-toggle" id="gratitude-filter-toggle" type="button" aria-pressed="false" title="Show gratitude entries only"></button>
    </div>

    <div id="log-body">
      <p class="skeleton">Loading…</p>
    </div>

    <div class="pager" id="pager" style="display:none">
      <button class="secondary" id="pager-prev" type="button">← Newer</button>
      <span class="pager-label" id="pager-label"></span>
      <button class="secondary" id="pager-next" type="button">Older →</button>
    </div>
  </div>

  <script src="/moods.js"></script>
  <script src="/gratitude.js"></script>
  <script>
    const FOLLOWUP_THEME_LABELS = {
      self_compassion: 'self-compassion follow up',
      act_values: 'act values follow up',
    };

    let _csrfToken = null;
    async function getCsrfToken() {
      if (!_csrfToken) {
        const r = await fetch('/api/csrf-token');
        const d = await r.json();
        _csrfToken = d.csrfToken;
      }
      return _csrfToken;
    }

    function autoResize(textarea) {
      textarea.style.height = 'auto';
      textarea.style.height = textarea.scrollHeight + 'px';
    }

    function startEdit(run, textEl, entry) {
      if (run.classList.contains('editing')) return;
      run.classList.add('editing');

      const textarea = document.createElement('textarea');
      textarea.className = 'entry-edit-textarea';
      textarea.value = entry.text;
      textEl.replaceWith(textarea);
      autoResize(textarea);
      textarea.focus();
      textarea.selectionStart = textarea.selectionEnd = textarea.value.length;
      textarea.addEventListener('input', () => autoResize(textarea));

      let finished = false;
      async function finish(save) {
        if (finished) return;
        finished = true;
        run.classList.remove('editing');

        const newText = textarea.value.trim();
        if (save && newText && newText !== entry.text) {
          entry.text = newText;
          textEl.textContent = newText;
          textarea.replaceWith(textEl);
          try {
            await fetch(`/api/journal/entries/${encodeURIComponent(entry.id)}`, {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': await getCsrfToken() },
              body: JSON.stringify({ text: newText }),
            });
          } catch (err) {
            console.error('update failed', err);
          }
        } else {
          textEl.textContent = entry.text;
          textarea.replaceWith(textEl);
        }
      }

      textarea.addEventListener('keydown', (ev) => {
        if (ev.key === 'Enter' && !ev.shiftKey) {
          ev.preventDefault();
          finish(true);
        } else if (ev.key === 'Escape') {
          ev.preventDefault();
          finish(false);
        }
      });
      textarea.addEventListener('blur', () => finish(true));
    }

    function leafGlyphSvg() {
      return '<svg width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22V12"/><path d="M12 12c0-3 2-5 6-5 0 3-2 5-6 5z"/><path d="M12 14c0-3-2-5-6-5 0 3 2 5 6 5z"/></svg>';
    }

    function moodGlyphSvg(index) {
      const m = MOODS[index];
      return `<svg width="100%" height="100%" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="20" cy="20" r="18"/><circle cx="14" cy="17" r="2" fill="currentColor" stroke="none"/><circle cx="26" cy="17" r="2" fill="currentColor" stroke="none"/><path d="${m.mouth}"/></svg>`;
    }

    function sunGlyphSvg() {
      return '<svg width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.5M12 19v2.5M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2.5 12H5M19 12h2.5M4.2 19.8L6 18M18 6l1.8-1.8"/></svg>';
    }

    function moonGlyphSvg() {
      return '<svg width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5z"/></svg>';
    }

    function localDateFromISO(iso) {
      const [y, m, d] = iso.split('-').map(Number);
      return new Date(y, m - 1, d);
    }

    function todayISO() {
      const now = new Date();
      const pad = n => String(n).padStart(2, '0');
      return `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
    }

    function renderEmpty() {
      const body = document.getElementById('log-body');
      body.innerHTML = '';
      const wrap = document.createElement('div');
      wrap.className = 'log-empty';
      const p = document.createElement('p');
      p.textContent = 'Nothing here yet.';
      const btn = document.createElement('a');
      btn.className = 'btn';
      btn.href = '/';
      btn.textContent = 'Write your first entry';
      wrap.appendChild(p);
      wrap.appendChild(btn);
      body.appendChild(wrap);
    }

    function renderEntries(entries) {
      const body = document.getElementById('log-body');
      body.innerHTML = '';

      if (!entries.length) {
        renderEmpty();
        return;
      }

      const today = todayISO();

      // Entries already arrive sorted by date desc, order desc — group in that order.
      const groups = [];
      let currentGroup = null;
      entries.forEach((e) => {
        if (!currentGroup || currentGroup.date !== e.date) {
          currentGroup = { date: e.date, entries: [] };
          groups.push(currentGroup);
        }
        currentGroup.entries.push(e);
      });

      groups.forEach((group) => {
        const d = localDateFromISO(group.date);
        const isToday = group.date === today;

        const row = document.createElement('div');
        row.className = 'day-group';

        const dateCol = document.createElement('div');
        dateCol.className = 'day-date-col';
        const dateInner = document.createElement('div');
        dateInner.className = 'day-date-inner';

        const weekday = document.createElement('span');
        weekday.className = 'day-weekday';
        weekday.textContent = (isToday ? 'Today' : d.toLocaleDateString(undefined, { weekday: 'short' })) + ',';

        const month = document.createElement('span');
        month.className = 'day-month';
        month.textContent = d.toLocaleDateString(undefined, { month: 'short' });

        const dayNum = document.createElement('span');
        dayNum.className = 'day-number' + (isToday ? ' today' : '');
        dayNum.textContent = String(d.getDate());

        const year = document.createElement('span');
        year.className = 'day-year';
        year.textContent = String(d.getFullYear());

        dateInner.appendChild(weekday);
        dateInner.appendChild(month);
        dateInner.appendChild(dayNum);
        dateInner.appendChild(year);
        dateCol.appendChild(dateInner);

        const prose = document.createElement('p');
        prose.className = 'day-prose';

        const visible = group.entries.filter((e) => {
          const hasMood = e.mood !== null && e.mood !== undefined;
          const hasText = e.text && String(e.text).trim();
          return hasText || hasMood;
        });

        if (visible.length) {
          const sun = document.createElement('span');
          sun.className = 'day-bookend day-bookend-sun';
          sun.innerHTML = sunGlyphSvg();
          prose.appendChild(sun);
        }

        // Reversed so entries read chronologically (earliest first, latest last)
        // within the day, even though the API returns newest-first overall.
        const chronological = visible.slice().reverse();

        chronological.forEach((e, i) => {
          const hasMood = e.mood !== null && e.mood !== undefined;
          const hasText = e.text && String(e.text).trim();
          const hasFollowup = e.followupAnswer && String(e.followupAnswer).trim();

          const run = document.createElement('span');
          run.className = 'entry-run';

          if (e.gratitude && hasText) {
            const leaf = document.createElement('span');
            leaf.className = 'entry-icon entry-icon-leaf';
            leaf.title = e.gratitudeTag || 'Grateful for';
            leaf.innerHTML = leafGlyphSvg();
            run.appendChild(leaf);
          }

          if (hasText) {
            const textEl = document.createElement('span');
            textEl.className = 'entry-text-inline';
            textEl.textContent = e.text.trim();
            textEl.tabIndex = 0;
            textEl.addEventListener('click', () => startEdit(run, textEl, e));
            run.appendChild(textEl);
          }

          if (hasMood) {
            const face = document.createElement('span');
            face.className = 'entry-icon entry-icon-mood';
            face.title = MOODS[e.mood].name;
            face.innerHTML = moodGlyphSvg(e.mood);
            run.appendChild(face);
          }

          if (hasFollowup) {
            const item = document.createElement('span');
            item.className = 'entry-icon entry-icon-followup';
            item.tabIndex = 0;
            item.title = FOLLOWUP_THEME_LABELS[e.followupTheme] || 'follow up';
            item.innerHTML = followupSvg('100%');

            const tip = document.createElement('div');
            tip.className = 'followup-tooltip';
            if (e.followupQuestion) {
              const q = document.createElement('span');
              q.className = 'followup-tooltip-question';
              q.textContent = e.followupQuestion;
              tip.appendChild(q);
            }
            const a = document.createElement('span');
            a.textContent = e.followupAnswer;
            tip.appendChild(a);
            item.appendChild(tip);
            run.appendChild(item);
          }

          prose.appendChild(run);

          if (i < chronological.length - 1) {
            const sep = document.createElement('span');
            sep.className = 'entry-sep';
            sep.textContent = ' • ';
            prose.appendChild(sep);
          }
        });

        if (visible.length) {
          const moon = document.createElement('span');
          moon.className = 'day-bookend day-bookend-moon';
          moon.innerHTML = moonGlyphSvg();
          prose.appendChild(moon);
        }

        row.appendChild(dateCol);
        row.appendChild(prose);
        body.appendChild(row);
      });
    }

    const DAYS_PER_PAGE = 5;
    let allEntries = [];
    let page = 0;
    let gratitudeOnly = false;

    // Entries arrive sorted by date desc, order desc — group in that order.
    function groupByDate(entries) {
      const groups = [];
      let current = null;
      entries.forEach((e) => {
        if (!current || current.date !== e.date) {
          current = { date: e.date, entries: [] };
          groups.push(current);
        }
        current.entries.push(e);
      });
      return groups;
    }

    const pager = document.getElementById('pager');
    const pagerLabel = document.getElementById('pager-label');
    const pagerPrev = document.getElementById('pager-prev');
    const pagerNext = document.getElementById('pager-next');

    const gratitudeFilterToggle = document.getElementById('gratitude-filter-toggle');
    gratitudeFilterToggle.innerHTML = sproutSvg(16);
    gratitudeFilterToggle.addEventListener('click', () => {
      gratitudeOnly = !gratitudeOnly;
      gratitudeFilterToggle.classList.toggle('on', gratitudeOnly);
      gratitudeFilterToggle.setAttribute('aria-pressed', String(gratitudeOnly));
      gratitudeFilterToggle.title = gratitudeOnly ? 'Show all entries' : 'Show gratitude entries only';
      page = 0;
      renderPage();
    });

    function renderPage() {
      const filtered = gratitudeOnly ? allEntries.filter((e) => e.gratitude) : allEntries;
      const groups = groupByDate(filtered);
      const totalPages = Math.max(1, Math.ceil(groups.length / DAYS_PER_PAGE));
      page = Math.min(page, totalPages - 1);
      const startDay = page * DAYS_PER_PAGE;
      const pageGroups = groups.slice(startDay, startDay + DAYS_PER_PAGE);
      const pageItems = pageGroups.flatMap((g) => g.entries);

      if (!filtered.length && gratitudeOnly) {
        const body = document.getElementById('log-body');
        body.innerHTML = '';
        const wrap = document.createElement('div');
        wrap.className = 'log-empty';
        const p = document.createElement('p');
        p.textContent = 'No gratitude entries yet.';
        wrap.appendChild(p);
        body.appendChild(wrap);
      } else {
        renderEntries(pageItems);
      }

      if (totalPages > 1) {
        pager.style.display = '';
        pagerLabel.textContent = `${pageItems.length} entries · days ${startDay + 1}–${startDay + pageGroups.length} of ${groups.length}`;
        pagerPrev.disabled = page === 0;
        pagerNext.disabled = page >= totalPages - 1;
      } else {
        pager.style.display = 'none';
      }
    }

    pagerPrev.addEventListener('click', () => {
      if (page > 0) { page -= 1; renderPage(); window.scrollTo({ top: 0 }); }
    });
    pagerNext.addEventListener('click', () => {
      const filtered = gratitudeOnly ? allEntries.filter((e) => e.gratitude) : allEntries;
      const totalPages = Math.max(1, Math.ceil(groupByDate(filtered).length / DAYS_PER_PAGE));
      if (page < totalPages - 1) { page += 1; renderPage(); window.scrollTo({ top: 0 }); }
    });

    fetch('/api/journal/entries')
      .then((r) => r.json())
      .then((data) => {
        if (!data.ok) throw new Error(data.error || 'Failed to load');
        allEntries = data.entries;
        page = 0;
        renderPage();
      })
      .catch((e) => {
        const body = document.getElementById('log-body');
        body.innerHTML = '';
        const err = document.createElement('div');
        err.className = 'error';
        err.textContent = 'Could not load journal: ' + e.message;
        body.appendChild(err);
      });
  </script>
  <nav class="auth-bar"><a href="/api/logout">Sign out</a></nav>
</body>
</html>
