# FORGE CONFIG (DO NOT REMOVE!)
include forge-conf/3264110/before/*;
include forge-conf/3264110/willow.jerome-arfouche.ca/before/*;

server {
    http2 on;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name willow.jerome-arfouche.ca;
    server_tokens off;
    root /home/forge/willow.jerome-arfouche.ca/current/public;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Block source maps from being served
    location ~* \.map$ {
        return 404;
    }

    # --- Bot / scanner mitigation ---
    # Shared rules (scanner UA blocklist, WP/Joomla/IoT/admin probes, dotfile
    # drop, known skimmer filenames) — canonical source:
    # ~/Code/scripts/infra/nginx/snippets/bot-mitigation.conf
    include snippets/bot-mitigation.conf;

    # To enable rate limiting for this app, uncomment (zone already declared
    # in /etc/nginx/conf.d/rate-limits.conf):
    # limit_req zone=willow_api burst=40 nodelay;
    # limit_req_status 429;

    # App-specific: willow ships no /js, /assets, or /static directories, so
    # any request under these paths is a scanner checking whether this box
    # is already compromised by a prior campaign. Kept local rather than
    # promoted to the shared snippet — other apps do serve paths like these.
    location ~* ^/(js/|assets/js/|static/) {
        return 444;
    }

    # App-specific: non-dotfile secret/config fishing (dotfiles like .env
    # are covered by the shared dotfile rule above)
    location ~* ^/(secrets\.(json|yaml)|client_secret\.json|config\.(json|yaml|yml))$ {
        return 444;
    }
    # --- End bot / scanner mitigation ---

    # All traffic goes through Express — auth gate is enforced there
    location / {
        proxy_pass http://localhost:9090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FORGE SSL (DO NOT REMOVE!)
    ssl_certificate /etc/nginx/ssl/domains/1818825/3611246/server.crt;
    ssl_certificate_key /etc/nginx/ssl/domains/1818825/3611246/server.key;

    include forge-conf/3264110/site.conf;
}

# FORGE CONFIG (DO NOT REMOVE!)
include forge-conf/3264110/after/*;
include forge-conf/3264110/willow.jerome-arfouche.ca/after/*;

