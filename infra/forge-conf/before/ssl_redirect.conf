server {
    listen 80;
    listen [::]:80;
    server_tokens off;

    server_name .willow.jerome-arfouche.ca;
    # Bot rules first, then redirect (see util/infra/nginx/snippets/http-redirect.conf).
    # Edited by hand on the server; Forge may regenerate this file, so `./snapshot.sh` checks it.
    include snippets/http-redirect.conf;
}
